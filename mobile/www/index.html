<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>مدير بصمة IBRA</title>
<style>
:root{--bg:#0b0b0d;--bg2:#121215;--card:#17171b;--card2:#1f1f25;--line:#2a2a31;--gold:#c9a84c;--gold2:#e6c76a;--text:#f2efe6;--muted:#9a968c;--ok:#3ecf8e;--warn:#f0a93b;--bad:#ef5350;--info:#5aa9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif;font-size:15px;height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#151519,#0e0e11);border-bottom:1px solid var(--line)}
header img{width:36px;height:36px;border-radius:9px}
header h1{font-size:18px;margin:0;color:var(--gold2);flex:1}
header small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:12px;font-size:18px}
main{flex:1;overflow-y:auto;padding:14px 14px 20px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:#0f0f12;border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:6px 0;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:21px;font-weight:400}
nav button.active{color:var(--gold2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.day-h{color:var(--gold);font-size:13px;margin:16px 4px 8px}
.feed{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:9px}
.feed img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--card2);flex:none}
.feed .t{flex:1;min-width:0}
.feed b{display:block;font-size:16px}
.feed .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.feed .tm{text-align:left;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:#2c6e52}.tag.warn{color:var(--warn);border-color:#7a5a22}.tag.bad{color:var(--bad);border-color:#7a2f2e}.tag.info{color:var(--info);border-color:#2b4f78}.tag.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--gold2)}.stat span{font-size:11.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{color:var(--muted);font-size:13px}
.field input,.field select,.field textarea{background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px;outline:none;width:100%}
.btn{background:var(--gold);color:#111;border:0;border-radius:12px;padding:12px 16px;font-weight:700;width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.danger{background:#5a1f1e;color:#ffb4b2}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:10px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.emp-h{display:flex;align-items:center;gap:10px}
.emp-h img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--card2)}
.emp-h b{flex:1;font-size:16px}
.dl{font-size:13px;border-top:1px solid var(--line);padding:9px 0;display:flex;gap:8px;align-items:center}
.switch{display:flex;align-items:center;gap:10px;padding:8px 0}
.switch input{width:20px;height:20px;accent-color:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 14px;white-space:nowrap}
.chips button.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:14px;right:14px;background:var(--card2);border:1px solid var(--gold);padding:12px 14px;border-radius:14px;z-index:50;box-shadow:0 10px 30px #000;font-size:14px}
.overlay{position:fixed;inset:0;background:#000c;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay img{max-width:100%;border-radius:18px}
.lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.lock img{width:80px;border-radius:20px}
.dots{display:flex;gap:14px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold)}.dots i.f{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;direction:ltr}
.pad button{height:72px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:26px}
.sync{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:8px}
.about{text-align:center}.about img{width:84px;border-radius:20px}.about a{color:var(--gold2);display:block;padding:8px;text-decoration:underline}
.steps{line-height:1.9;padding-inline-start:20px;margin:6px 0 10px;font-size:14px}
.steps li{margin-bottom:4px}
.scan{position:fixed;inset:0;background:#000;z-index:70}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:50%;top:45%;width:70vw;height:70vw;max-width:320px;max-height:320px;transform:translate(-50%,-50%);border:4px solid var(--gold);border-radius:24px;box-shadow:0 0 0 2000px #0009}
.scan-msg{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 30px);text-align:center;font-size:17px;background:#000a;padding:10px;border-radius:12px}
.scan-x{position:absolute;left:30px;right:30px;bottom:calc(env(safe-area-inset-bottom) + 30px);width:auto;background:#000a}
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="">
  <h1>مدير بصمة IBRA<small id="hdrSub">حضور وانصراف الموظفين</small></h1>
  <button class="iconbtn" id="refreshBtn" title="تحديث">⟳</button>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="live" class="active"><b>🔔</b>المباشر</button>
  <button data-tab="today"><b>📋</b>اليوم</button>
  <button data-tab="salary"><b>💰</b>الرواتب</button>
  <button data-tab="settings"><b>⚙️</b>الإعدادات</button>
</nav>
<div id="toast" class="toast hidden"></div>
<script src="capacitor-core.js"></script>
<script src="jsQR.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
