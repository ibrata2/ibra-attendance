<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تنبيه — بصمة IBRA</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0d;color:#f2efe6;font-family:"Segoe UI",Tahoma,sans-serif;overflow:hidden;user-select:none}
.box{height:100%;box-sizing:border-box;border:4px solid #f0a93b;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:pulse 1.4s ease-in-out infinite;-webkit-app-region:drag}
@keyframes pulse{50%{border-color:#c9a84c;box-shadow:inset 0 0 60px #f0a93b33}}
.bell{font-size:64px;animation:ring 1s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(15deg)}40%{transform:rotate(-15deg)}60%{transform:rotate(8deg)}}
h1{margin:8px 0 4px;color:#f0a93b;font-size:30px}
.who{display:flex;align-items:center;gap:14px;margin:10px 0}
.who img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #c9a84c}
.who b{font-size:30px;color:#e6c76a}
p{font-size:20px;margin:6px 0 18px;color:#ddd}
.btns{display:flex;gap:12px;-webkit-app-region:no-drag}
button{font-family:inherit;font-size:20px;font-weight:700;border:0;border-radius:12px;padding:13px 26px;cursor:pointer}
.go{background:linear-gradient(135deg,#d9b55a,#a8822d);color:#111}
.ok{background:#22222a;color:#fff;border:1px solid #444}
small{color:#888;margin-top:12px}
</style></head>
<body><div class="box">
  <div class="bell">🔔</div>
  <h1 id="title">انتهى وقت الدوام</h1>
  <div class="who"><img id="ph" src="icon.png"><b id="name"></b></div>
  <p id="msg"></p>
  <div class="btns"><button class="go" id="go">تسجيل الانصراف الآن</button><button class="ok" id="ok">OK</button></div>
  <small id="rep"></small>
</div>
<script src="alert.js"></script>
</body></html>
