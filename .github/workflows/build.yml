name: بناء ونشر بصمة IBRA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --win dir --x64 --publish never
      - name: بناء المثبّت (NSIS)
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) { $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $mk)) { choco install nsis -y --no-progress; $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          Push-Location build
          & $mk /V2 "/DVERSION=$v" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cp ../app/logic.js www/logic.js
      - run: npm install
      - run: which pod || sudo gem install cocoapods
      - run: xcodebuild -version
      - run: npx cap add ios || true
      - run: python3 ios-patch.py
      - run: cd ios/App && pod install --repo-update
      - run: npx cap sync ios
      - name: بناء IPA بدون توقيع (يتوقع على الايفون)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" | tail -20
          mkdir -p Payload && cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry IBRA-Attendance-Manager.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: mobile/IBRA-Attendance-Manager.ipa }

  release:
    needs: [windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: بصمة IBRA v${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            **بصمة IBRA** — حضور وانصراف الموظفين ببصمة الوجه
            - `IBRA-Attendance-Setup-*.exe` برنامج الحاسبة (ويندوز)
            - `IBRA-Attendance-Manager.ipa` تطبيق المدير للايفون (يتوقع على الجهاز)
            - بصمة وجه دقيقة: 3 لقطات متتالية + رفض الوجه إذا كان أقرب لموظف ثاني
            - زر تجربة البصمة للأدمن مع نسبة التطابق
            - تذكير الحضور: إشعار ببداية الدوام وتنبيه كبير بعد وقت السماح
          files: |
            out/windows/*.exe
            out/ios/*.ipa
